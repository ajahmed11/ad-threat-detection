title: Password Spraying - Many Distinct Account Failures From One Source
id: dde8c58c-f2ef-41ae-953a-eadba51614ac
status: experimental
description: Detects multiple failed logons (Event 4625) against distinct accounts from a single source IP in a short window, the signature of password spraying.
references:
    - https://attack.mitre.org/techniques/T1110/003/
author: AJ (UFCE8A-30-3 Cyber Security Project)
date: 2026/11/14
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 4625
    condition: selection | count(TargetUserName) by IpAddress > 8
    timeframe: 2m
falsepositives:
    - Misconfigured service or application retrying credentials
level: high
tags:
    - attack.credential_access
    - attack.t1110.003
